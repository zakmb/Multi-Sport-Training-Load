spring.application.name=multi-sport-training-load
server.port=8080

# Local file DB so ingested sessions stick around between runs.
spring.datasource.url=jdbc:h2:file:./data/trainingload;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${TRAININGLOAD_DB_PASSWORD:changeme}

# H2 console off by default; enable with --spring.profiles.active=h2console
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=${TRAININGLOAD_USER:admin}
spring.security.user.password=${TRAININGLOAD_PASSWORD:changeme}

# Default folder for FIT ingest (override via request param or property)
trainingload.fit.training-data-dir=training-data